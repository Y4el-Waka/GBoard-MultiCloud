<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard PRTG - Login</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tailwind/tailwind.min.css') }}?v=3.4.17">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter/inter.css') }}?v=5.3.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}?v=6.4.0">

  <style>
    :root {
      --panel: rgba(8, 8, 11, 0.92);
      --panel-solid: #08080b;
      --border: #24242c;
      --muted: #9ca3af;
      --text: #f4f4f5;
      --purple: #2e064f;
      --purple-2: #581c87;
      --purple-3: #7c3aed;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
  background:
    linear-gradient(rgba(20, 10, 35, 0.20), rgba(0, 0, 0, 0.34)),
    radial-gradient(circle at 18% 18%, rgba(124, 58, 237, 0.16), transparent 28rem),
    radial-gradient(circle at 82% 72%, rgba(59, 7, 100, 0.16), transparent 30rem),
    url("{{ url_for('static', filename='img/login-bg.jpg') }}");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      
    }

    .login-shell {
      position: relative;
      z-index: 1;
    }

    .login-card {
  background: rgba(12, 12, 18, 0.66);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    0 24px 70px rgba(0, 0, 0, 0.45),
    0 0 0 1px rgba(124, 58, 237, 0.08);
  backdrop-filter: blur(14px);
}

    .login-topbar {
  background: rgba(40, 12, 72, 0.55);
  border-bottom: 1px solid rgba(255, 255, 255, 0.10);
}

    .brand-icon {
  background: rgba(124, 58, 237, 0.20);
  border: 1px solid rgba(216, 180, 254, 0.28);
  box-shadow: none;
}

    .status-pill {
      background: #050507;
      border: 1px solid #24242c;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 rgba(34, 197, 94, 0.65);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.65);
      }

      70% {
        box-shadow: 0 0 0 9px rgba(34, 197, 94, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    .field {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #f4f4f5;
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
}

.field::placeholder {
  color: rgba(212, 212, 216, 0.55);
}

.field:focus {
  outline: none;
  border-color: rgba(216, 180, 254, 0.70);
  box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.16);
  background: rgba(255, 255, 255, 0.12);
}

    .login-button {
  background: rgba(88, 28, 135, 0.82);
  border: 1px solid rgba(216, 180, 254, 0.28);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
  transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}

.login-button:hover {
  transform: translateY(-1px);
  background: rgba(107, 33, 168, 0.92);
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
}

.login-button:active {
  transform: translateY(0);
}

    .error-box {
      background: rgba(127, 29, 29, 0.24);
      border: 1px solid rgba(239, 68, 68, 0.34);
      color: #fecaca;
    }

    .forgot-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .forgot-modal.hidden {
      display: none;
    }

    .forgot-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
    }

    .forgot-panel {
      position: relative;
      width: 100%;
      max-width: 360px;
      border-radius: 22px;
      background: #08080b;
      border: 1px solid #27272a;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.85);
      padding: 28px;
      text-align: center;
      animation: forgotIn 0.18s ease;
    }

    .forgot-close {
      position: absolute;
      top: 14px;
      right: 14px;
      color: #71717a;
      transition: color 0.16s ease;
    }

    .forgot-close:hover {
      color: #f4f4f5;
    }

    .forgot-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b0764, #581c87);
      border: 1px solid rgba(168, 85, 247, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e9d5ff;
      font-size: 26px;
    }

    .forgot-ok-btn {
      margin-top: 22px;
      width: 100%;
      border-radius: 14px;
      padding: 11px 14px;
      background: linear-gradient(135deg, #3b0764, #581c87);
      color: white;
      font-size: 14px;
      font-weight: 800;
      border: 1px solid rgba(168, 85, 247, 0.35);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .forgot-ok-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #4c1d95, #6b21a8);
    }

    @keyframes forgotIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
  <main class="login-shell w-full max-w-md">
    <section class="login-card rounded-2xl overflow-hidden">
      <div class="login-topbar px-6 py-4">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="brand-icon h-11 w-11 rounded-xl flex items-center justify-center">
              <i class="fas fa-network-wired text-violet-200 text-xl"></i>
            </div>

            <div>
  <h1 class="text-lg font-extrabold text-white leading-tight">
    Dashboard PRTG
  </h1>
  <p class="text-xs text-zinc-300/70 mt-0.5">
    Monitoreo interno
  </p>
</div>
          </div>
        </div>
      </div>

      <div class="p-7 sm:p-8">
        <div class="mb-7 text-center">
          <h2 class="text-2xl font-extrabold text-zinc-100">
            Iniciar sesión
          </h2>
          <p class="text-sm text-zinc-400 mt-1">
            Accede a la consola de monitoreo 24/7.
          </p>
        </div>

        <form method="post" action="{{ url_for('login') }}" class="space-y-5" autocomplete="on">
          {% if error %}
          <div class="error-box rounded-xl p-4" role="alert">
            <div class="flex items-start gap-3">
              <i class="fas fa-circle-exclamation text-red-400 mt-0.5"></i>
              <p class="text-sm leading-relaxed">{{ error }}</p>
            </div>
          </div>
          {% endif %}

          <div>
            <label for="username" class="block text-sm font-bold text-zinc-300 mb-2">
              Usuario
            </label>

            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <i class="fas fa-user text-zinc-500"></i>
              </div>

              <input
                id="username"
                name="username"
                type="text"
                required
                autofocus
                autocomplete="username"
                class="field pl-11 block w-full rounded-xl py-3 px-4 text-sm"
                placeholder="usuario o correo">
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-bold text-zinc-300 mb-2">
              Contraseña
            </label>

            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <i class="fas fa-lock text-zinc-500"></i>
              </div>

              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
                class="field pl-11 pr-12 block w-full rounded-xl py-3 px-4 text-sm"
                placeholder="tu contraseña">

              <button
                id="toggle-password"
                type="button"
                class="absolute inset-y-0 right-0 px-3.5 flex items-center text-zinc-500 hover:text-zinc-200 transition"
                aria-label="Mostrar u ocultar contraseña">
                <i id="toggle-password-icon" class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="login-button w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-extrabold text-white">
            <i class="fas fa-right-to-bracket"></i>
            Entrar al dashboard
          </button>

          <button
            id="forgot-password-btn"
            type="button"
            class="w-full text-sm font-semibold text-zinc-500 hover:text-violet-300 transition">
            Olvidé mi contraseña
          </button>
        </form>

        <p class="text-center text-[11px] text-zinc-600 mt-6">
          Plataforma de monitoreo interno · Acceso autorizado
        </p>
      </div>
    </section>
  </main>

  <div id="forgot-modal" class="forgot-modal hidden">
    <div class="forgot-backdrop"></div>

    <div class="forgot-panel">
      <button id="forgot-close" type="button" class="forgot-close">
        <i class="fas fa-xmark"></i>
      </button>

      <div class="forgot-icon">
        <i class="fas fa-face-grin-squint-tears"></i>
      </div>

      <h3 class="text-xl font-extrabold text-zinc-100 mt-4">
        ni modo
      </h3>

      <p class="text-sm text-zinc-400 mt-2">
        Háblale al admin, papito.
      </p>

      <button id="forgot-ok" type="button" class="forgot-ok-btn">
        Va, entendido
      </button>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-password-icon');

    togglePassword?.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';

      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.classList.toggle('fa-eye', !isPassword);
      toggleIcon.classList.toggle('fa-eye-slash', isPassword);
    });

    const forgotBtn = document.getElementById('forgot-password-btn');
    const forgotModal = document.getElementById('forgot-modal');
    const forgotClose = document.getElementById('forgot-close');
    const forgotOk = document.getElementById('forgot-ok');

    function openForgotModal() {
      forgotModal?.classList.remove('hidden');
    }

    function closeForgotModal() {
      forgotModal?.classList.add('hidden');
    }

    forgotBtn?.addEventListener('click', openForgotModal);
    forgotClose?.addEventListener('click', closeForgotModal);
    forgotOk?.addEventListener('click', closeForgotModal);

    forgotModal?.addEventListener('click', (event) => {
      if (event.target === forgotModal || event.target.classList.contains('forgot-backdrop')) {
        closeForgotModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeForgotModal();
      }
    });
  </script>
</body>
</html>

name: CoreView container CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreview-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-smoke-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COREVIEW_IMAGE: coreview-cloud-lab:0.5c

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Build pinned local frontend assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          git diff --exit-code -- static/vendor

      - name: Create ephemeral laboratory secrets
        run: |
          printf 'COREVIEW_LAB_APP_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'COREVIEW_LAB_ADMIN_PASSWORD=%s\n' "ci-$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run JavaScript tests
        run: npm run test:frontend

      - name: Run static validation
        run: |
          python -m compileall .
          git diff --check HEAD
          docker compose config --quiet

      - name: Prove clean-state startup
        run: |
          docker compose down --volumes --remove-orphans || true
          docker compose up --detach --build --wait --wait-timeout 180

      - name: Run full synthetic smoke
        run: python scripts/docker_lab_smoke.py

      - name: Run bounded API burst under resource limits
        run: |
          python scripts/docker_lab_burst.py \
            --requests 180 \
            --workers 6 \
            --output artifacts/resource-limits/burst.json

      - name: Run restricted resource soak
        run: |
          python scripts/docker_lab_soak.py \
            --duration 300 \
            --interval 15 \
            --output artifacts/resource-limits/soak

      - name: Run browser smoke without external network
        run: scripts/run_offline_frontend_smoke.sh

      - name: Verify persistence across consumer restart
        run: |
          docker compose restart collector app
          docker compose up --detach --wait --wait-timeout 120
          COREVIEW_LAB_EXPECT_PERSISTED=1 python scripts/docker_lab_smoke.py

      - name: Capture resource snapshot
        run: |
          mkdir -p artifacts/container
          docker stats --no-stream --format '{{json .}}' > artifacts/container/docker-stats.jsonl

      - name: Generate SBOM and scan image
        run: bash scripts/container_supply_chain.sh artifacts/container

      - name: Upload auditable container artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coreview-container-evidence
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Clean Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans
